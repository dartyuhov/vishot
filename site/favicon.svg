<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 32 32" width="512" height="512" shape-rendering="crispEdges">
  <!-- The 32 px master: pixel art on a 32×32 grid, one unit per pixel, scaled only by whole numbers
       (scripts/icon.sh). 16 px has its own master, vishot-mark-16.svg. Shapes are painted in order. -->
  <!-- Palette.hintLeaf hard shadow, one cell down and right -->
  <path fill="#FFD147" d="M5 4H29V5H30V29H29V30H5V29H4V5H5Z"/>
  <!-- Palette.accent plate, 26 of 32 like macOS's 824 of 1024, a corner cell left out -->
  <path fill="#6B5CFA" d="M4 3H28V4H29V28H28V29H4V28H3V4H4Z"/>
  <!-- the pixel font's v, mirror-symmetric and centered on the plate -->
  <defs>
    <path id="v" d="M9 8h4v7h-4zM19 8h4v7h-4zM10 15h4v2h-4zM18 15h4v2h-4zM11 17h4v2h-4zM17 17h4v2h-4zM12 19h8v1h-8zM13 20h6v1h-6zM14 21h4v1h-4z"/>
  </defs>
  <!-- its extrusion in a shade of the accent: the v again, two cells deep -->
  <use xlink:href="#v" fill="#4637C7" transform="translate(2 2)"/>
  <use xlink:href="#v" fill="#4637C7" transform="translate(1 1)"/>
  <use xlink:href="#v" fill="#EDEDF5"/>
</svg>
