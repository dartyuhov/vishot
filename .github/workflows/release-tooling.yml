name: Release tooling

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  validate:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: scripts/release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/release/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Validate Homebrew release tooling
        working-directory: ${{ github.workspace }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
          VISHOT_TEST_HOMEBREW: "1"
        run: python3 -B -m unittest discover -s scripts/homebrew -p 'test_*.py' -v
  contracts:
    name: Release tooling
    needs: [changes, validate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require applicable release contracts
        env:
          DETECTION: ${{ needs.changes.result }}
          NEEDED: ${{ needs.changes.outputs.release }}
          RESULT: ${{ needs.validate.result }}
        run: |
          test "$DETECTION" = success || exit 1
          if [ "$NEEDED" = true ]; then test "$RESULT" = success;
          else test "$NEEDED" = false && test "$RESULT" = skipped; fi
