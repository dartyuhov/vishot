# Tests the landing page server. Railway waits for this to pass before deploying `main`.
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/**', 'scripts/ci/**']
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  test:
    name: Site tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ always() }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require successful change detection
        env:
          RESULT: ${{ needs.changes.result }}
          NEEDED: ${{ needs.changes.outputs.site }}
        run: test "$RESULT" = success && { test "$NEEDED" = true || test "$NEEDED" = false; }
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.site == 'true'
        with:
          node-version-file: site/.node-version
      - run: npm ci
        if: needs.changes.outputs.site == 'true'
      - run: npm test
        if: needs.changes.outputs.site == 'true'
