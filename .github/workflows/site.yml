# Tests the landing page server. Railway waits for this to pass before deploying `main`.
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Site tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.node-version
      - run: npm ci
      - run: npm test
